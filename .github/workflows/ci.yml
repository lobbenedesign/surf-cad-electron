name: CI

# Scope: tests + type-check only. Electron packaging (build:win/mac/linux via
# electron-builder) is intentionally NOT run here — it needs platform-specific
# native toolchains/code signing and is out of scope for a fast PR/push gate.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (main + renderer)
        run: npm run typecheck

      - name: Run tests
        run: npm test
